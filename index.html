<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Campionatore</title>
    <meta name="description" content="Campionatore da studio nel browser: pad grid, editor waveform e kit offline-first." />

    <meta name="theme-color" content="#16171A" />
    <meta name="background-color" content="#16171A" />
    <link rel="manifest" href="manifest.json" />

    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Campionatore" />
  </head>
  <body>
    <div id="app">
      <div class="app">
        <header class="app-header">
          <span class="app-header__kit">Kit 01 — Kicks</span>
          <span class="app-header__status" id="status-indicator" data-state="idle">● REC</span>
        </header>

        <main class="pad-grid" id="pad-grid" role="grid" aria-label="Griglia pad"></main>

        <nav class="drawer-tabs" aria-label="Pannello di modifica">
          <button class="drawer-tabs__tab" data-tab="edit" aria-selected="true">Edit</button>
          <button class="drawer-tabs__tab" data-tab="mix" aria-selected="false">Mix</button>
          <button class="drawer-tabs__tab" data-tab="fx" aria-selected="false">FX</button>
          <button class="drawer-tabs__handle" id="drawer-handle" aria-expanded="false" aria-controls="drawer" aria-label="Espandi pannello">▲</button>
        </nav>

        <section class="drawer" id="drawer" hidden>
          <div class="drawer__panel" data-panel="edit">
            <p class="drawer__hint">Tocca un pad per selezionarlo, poi carica un file o registra dal microfono.</p>
            <div class="drawer__pad-target" id="edit-pad-target">Pad 01</div>
            <div class="drawer__sample-name" id="edit-sample-name">Vuoto</div>
            <div class="drawer__meter" id="edit-meter" hidden>
              <div class="drawer__meter-fill" id="edit-meter-fill"></div>
            </div>
            <div class="drawer__actions">
              <button type="button" class="btn" id="load-button">Load</button>
              <button type="button" class="btn btn--record" id="record-button">Rec</button>
              <button type="button" class="btn" id="preview-button" disabled>▶ Preview</button>
            </div>
            <p class="drawer__status" id="edit-status" role="status"></p>
            <input type="file" id="file-input" accept="audio/*" hidden />
          </div>
          <div class="drawer__panel" data-panel="mix" hidden>
            <p>Mixer disponibile in un prossimo step.</p>
          </div>
          <div class="drawer__panel" data-panel="fx" hidden>
            <p>Effetti disponibili in un prossimo step.</p>
          </div>
        </section>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
